# ===================================================================
# PeopleFlow - Application Configuration
# ===================================================================

spring.application.name=peopleflow
server.port=8080

# -------------------------------------------------------------------
# Database Configuration (MySQL 8)
# Supports environment variables for credential isolation
# -------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:peopleflow_db}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# -------------------------------------------------------------------
# JPA / Hibernate Configuration
# Development note: ddl-auto=update allows rapid entity modeling.
# In production, this should be set to 'validate' or 'none' with Flyway/Liquibase migrations.
# -------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Disable Open Session In View (OSIV) to prevent unexpected lazy loading queries outside transaction boundary
spring.jpa.open-in-view=false
